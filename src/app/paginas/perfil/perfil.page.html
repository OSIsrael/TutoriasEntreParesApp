<ion-header class="ion-no-border">
  <ion-toolbar class="header-blanco">
    <img src="assets/logo-tutorias.png" alt="Tutorías entre Pares" class="logo-cabecera" slot="start" onerror="this.src='assets/logo-gietaes.png'">

    <ion-buttons slot="end" style="margin-right: 10px;">
      <ion-button (click)="irANotificaciones()" style="position: relative; --background: rgba(0, 51, 102, 0.05); --border-radius: 50%; width: 45px; height: 45px;">
        <ion-icon name="notifications-outline" style="color: #003366; font-size: 1.6rem;"></ion-icon>
        
        <div *ngIf="hayNotificacionesSinLeer" style="position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; background-color: #EAB308; border-radius: 50%; border: 2px solid white;"></div>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <div class="linea-separadora"></div>
</ion-header>

<ion-content class="fondo-app">
  
  <div class="ion-padding ion-text-center contenedor-perfil" style="margin-top: 30px;">
    <div class="usuario-fila">
      <ion-icon name="person-circle-outline" class="icono-avatar"></ion-icon>
      <div class="texto-usuario">
        <h2>{{ usuario.nombre }}</h2>
        <p style="display: inline-flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px;">
          <ion-icon name="mail-outline" style="color: #003366;"></ion-icon> {{ usuario.correo }}
        </p>
        
        <p style="display: inline-flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px; font-weight: bold; color: #003366;">
          <ion-icon name="business-outline"></ion-icon> SEDE: {{ usuario.sede }}
        </p>
        <p style="font-size: 0.8rem; color: #666; margin-top: 8px; font-weight: bold; text-transform: uppercase; background: rgba(0,0,0,0.05); padding: 4px 10px; border-radius: 6px; display: inline-block;">
          Rol: {{ rolUsuario }}
        </p>
      </div>
    </div>
  </div>
<!-- 🌟 SELECTOR DINÁMICO DE PERIODO (DISEÑO CORREGIDO) -->
    <div style="padding: 0 15px; margin-bottom: 25px;">
      <ion-segment [(ngModel)]="filtroPeriodo" (ionChange)="cargarEstadisticasEstudiante()" mode="ios" style="background: #e2e8f0; border-radius: 10px; padding: 4px;">
        
        <!-- Botón Periodo -->
        <ion-segment-button value="ACTUAL" style="--color: #64748b; --color-checked: #ffffff; --indicator-color: #003366;">
          <ion-label style="font-weight: 800; font-size: 0.8rem; letter-spacing: 0.5px;">PERIODO {{ periodoActualApp }}</ion-label>
        </ion-segment-button>
        
        <!-- Botón Histórico -->
        <ion-segment-button value="HISTORICO" style="--color: #64748b; --color-checked: #ffffff; --indicator-color: #003366;">
          <ion-label style="font-weight: 800; font-size: 0.8rem; letter-spacing: 0.5px;">HISTÓRICO</ion-label>
        </ion-segment-button>
        
      </ion-segment>
    </div>
  <div class="ion-padding" style="margin-top: 5px;">
    <h3 style="color: #003366; font-weight: 900; margin-bottom: 15px; font-size: 1.1rem; text-align: center;">
      MI RENDIMIENTO ACADÉMICO
    </h3>
    
    <div style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; border: 2px solid #e2e8f0;">
      <h4 style="margin: 0; color: #475569; font-size: 0.9rem; text-transform: uppercase; font-weight: bold;">Tutorías Recibidas</h4>
      <p style="margin: 5px 0 0 0; font-size: 3rem; font-weight: 900; color: #003366;">{{ totalTutorias }}</p>
    </div>

    <div style="background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px solid #e2e8f0;" [style.display]="totalTutorias > 0 ? 'block' : 'none'">
      <p style="text-align: center; color: #475569; font-size: 0.85rem; font-weight: bold; margin-top: 0; margin-bottom: 15px;">MATERIAS REFORZADAS</p>
      <canvas #barCanvas></canvas>
    </div>

    <div *ngIf="totalTutorias === 0" style="text-align: center; padding: 20px; background: rgba(0, 51, 102, 0.05); border-radius: 12px; margin-top: 20px; border: 1px dashed #cbd5e1;">
      <ion-icon name="analytics-outline" style="font-size: 3rem; color: #94a3b8;"></ion-icon>
      <p style="color: #64748b; font-size: 0.9rem; margin-top: 10px; font-weight: 500;">Aún no tienes estadísticas.<br>¡Agenda tu primera tutoría para ver tu progreso!</p>
    </div>
  </div>
  <div class="fab-container">
    <div class="fab-menu" *ngIf="menuAbierto">
      
      <button class="fab-item" *ngIf="puedePostularse" (click)="irAPostulacion()">
        POSTULARSE <ion-icon name="book-outline"></ion-icon>
      </button>

      <button class="fab-item" *ngIf="esTutor" (click)="irAPanelTutor()">
        PANEL TUTOR <ion-icon name="school-outline"></ion-icon>
      </button>

      <button class="fab-item" *ngIf="esAdmin" (click)="irAAdministracion()">
        PANEL ADMIN <ion-icon name="settings-outline"></ion-icon>
      </button>

      <button class="fab-item" (click)="cerrarSesion()">
        CERRAR SESIÓN <ion-icon name="log-out-outline"></ion-icon>
      </button>

    </div>
    <button class="fab-amarillo" (click)="toggleMenu()">
      <ion-icon name="people-outline"></ion-icon>
    </button>
  </div>
</ion-content>
